spring:
  profiles:
    active: dev

---
spring:
  profiles: dev
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/customer_identity_db}
    username: ${JDBC_USER:postgres}
    password: ${JDBC_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
