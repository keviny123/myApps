name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [h2, postgres]
    services: ${{ toJson(contains(matrix.db, 'postgres') && {
      postgres: {
        image: 'postgres:15',
        env: {
          POSTGRES_USER: 'postgres',
          POSTGRES_PASSWORD: 'postgres',
          POSTGRES_DB: 'customer_identity_db'
        },
        ports: ['5432:5432'],
        options: "--health-cmd 'pg_isready -U postgres' --health-interval 10s --health-timeout 5s --health-retries 5"
      }
    } ) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'

      - name: If postgres matrix, wait for Postgres
        if: matrix.db == 'postgres'
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break || sleep 1
          done

      - name: Build and test
        env:
          SPRING_PROFILES_ACTIVE: ${{ matrix.db == 'postgres' && 'dev' || 'test' }}
        run: mvn -B -DskipTests=false test
